<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - NWR Stream Manager</title>
__PAGE_SCRIPT_LOADER__
<style>
__BASE_PAGE_STYLES__
:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
body { margin: 0; background: #f6f7f9; color: #14181f; }
main { max-width: 480px; margin: 0 auto; padding: 32px 24px; }
.panel { background: #fff; border: 1px solid #d8dde6; border-radius: 8px; padding: 24px; }
label { display: block; margin: 14px 0; font-weight: 700; }
input { display: block; box-sizing: border-box; width: 100%; margin-top: 6px; font: inherit; padding: 10px; border: 1px solid #aab2c0; border-radius: 6px; }
.checkbox-row { font-weight: 400; }
.checkbox-row input { display: inline; width: auto; margin: 0 6px 0 0; }
.actions { margin-top: 18px; }
button { font: inherit; padding: 10px 14px; border: 1px solid #9aa4b2; border-radius: 6px; background: #fff; color: #14181f; cursor: pointer; }
.primary { background: #174a98; color: #fff; border-color: #174a98; }
.message { min-height: 1.5em; margin-top: 14px; font-weight: 700; }
.error { color: #a61b1b; }
.success { color: #17663a; }
footer { max-width: 480px; margin: 0 auto; padding: 0 24px 32px; }
footer a { color: #174a98; }
.screen-reader-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (prefers-color-scheme: dark) {
  .error { color: #ff8a8a; }
  .success { color: #7ee2a8; }
  body { background: #111827; color: #f9fafb; }
  .panel, button, input { background: #1f2937; color: #f9fafb; border-color: #4b5563; }
  .primary { background: #2563eb; border-color: #2563eb; }
  footer a { color: #93c5fd; }
}
</style>
</head>
<body>
<main>
  <section class="panel" aria-labelledby="sign_in_title">
    <h1 id="sign_in_title">Sign in to NWR Stream Manager</h1>
    <form id="sign_in_form" method="post" action="/sign-in">
      __FORM_TOKEN_INPUT__
      <input id="sign_in_next" type="hidden" name="next" value="/">
      <label for="sign_in_username">Username
        <input id="sign_in_username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required autofocus>
      </label>
      <label for="sign_in_password">Password
        <input id="sign_in_password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      </label>
      <label class="checkbox-row" for="sign_in_remember"><input id="sign_in_remember" name="remember" type="checkbox" value="1"> Remember this device for 30 days</label>
      <div class="actions">
        <button id="sign_in_submit" class="primary" type="submit">Sign in</button>
      </div>
    </form>
    <div id="sign_in_message" class="message" aria-live="polite"></div>
  </section>
</main>
<footer>
  <a id="footer_help" href="/help" target="_blank" rel="noopener">Help<span class="screen-reader-only"> (opens in a new tab)</span></a>
</footer>
<script type="text/x-nwr-app">
// Sent from the page, which stays put when the username or password is wrong. Browsers offer to
// save a password when its form is submitted or goes away, even a wrong one, so the form only goes
// once signing in has worked.
const signInForm = document.getElementById("sign_in_form");
const signInPassword = document.getElementById("sign_in_password");
const signInSubmit = document.getElementById("sign_in_submit");
const signInMessage = document.getElementById("sign_in_message");
function showSignInError(text) {
  signInMessage.textContent = text;
  signInMessage.className = "message error";
  signInMessage.setAttribute("role", "alert");
  signInPassword.value = "";
  signInPassword.focus();
}
signInForm.addEventListener("submit", async event => {
  event.preventDefault();
  if (signInSubmit.disabled) return;
  signInSubmit.disabled = true;
  // Cleared first, so the same message twice in a row is still read out.
  signInMessage.textContent = "";
  let data;
  try {
    const response = await fetch(signInForm.action, {
      method: "POST",
      headers: {"Accept": "application/json", "Content-Type": "application/x-www-form-urlencoded"},
      body: new URLSearchParams(new FormData(signInForm)),
      credentials: "same-origin"
    });
    data = await response.json();
  } catch (error) {
    signInSubmit.disabled = false;
    showSignInError("NWR Stream Manager couldn't be reached. Check your connection, then try again.");
    return;
  }
  if (data.form_token) {
    signInForm.elements.form_token.value = data.form_token;
  }
  if (data.error || !data.next) {
    signInSubmit.disabled = false;
    showSignInError(data.error || "Signing in didn't work. Please try again.");
    return;
  }
  signInForm.remove();
  signInMessage.textContent = "Signed in.";
  signInMessage.className = "message success";
  window.location.replace(data.next);
});
</script>
__PAGE_SCRIPT_STARTER__
</body>
</html>
